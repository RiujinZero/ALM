[project.optional-dependencies]
dev = [
  "numpy>=1.26",
  "pytest>=8.0",
  "ruff>=0.6",
]
vision = [
  "torchvision>=0.17",
]
stream = [
  "datasets>=2.19",
]
ann = [
  "hnswlib>=0.8",
]
alm = [
  "numba>=0.67,<0.68",
]
alm-gpu = [
  "cupy-cuda13x>=14,<15",
]
qwen = [
  "transformers>=4.57",
  "accelerate>=0.30",
]
world = [
  "torch>=2.11,<2.12",
  "transformers>=4.55,<6",
  "accelerate>=1.0",
  "peft>=0.17",
  "torchvision>=0.26,<0.27",
  "numpy>=1.26",
  "pillow>=11",
  "opencv-python-headless>=4.10",
  "fastapi>=0.116",
  "uvicorn[standard]>=0.35",
  "python-multipart>=0.0.20",
]

[tool.hatch.build.targets.wheel]
packages = ["src/manifoldflow", "src/gator_linear"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
# Vendored verbatim from GTR-sonic-ssm (src/manifoldflow/sonic_ssm.py's own
# docstring) - held to upstream's style, not this project's, so a re-copy
# stays a clean diff.
extend-exclude = [
  "src/manifoldflow/sonic_ssm.py",
  "src/manifoldflow/compute.py",
  "src/gator_linear",
  "vendor",
]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
